<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace — AgroCloud Vision</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: {
    50:'#eafbf0',100:'#d2f3df',600:'#16a34a',700:'#0f3d22',800:'#0a2e18',900:'#052e16'
  } } } } };
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  /* Plain CSS (not Tailwind utility classes) for the critical layout sizing,
     so the map never collapses to zero height if the Tailwind Play CDN
     hasn't generated its utility classes yet by the time Leaflet measures
     its container. */
  #appRoot { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
  #sidebar { width: 300px; min-width: 300px; height: 100%; }
  #mapMain { position: relative; flex: 1 1 auto; height: 100%; }
  #mapContainer { height: 100%; width: 100%; }
</style>
</head>
<body class="bg-gray-50">

<div id="appRoot" class="flex h-screen w-screen overflow-hidden">

  <!-- ====== Sidebar: organization, farms, fields, weather ====== -->
  <aside id="sidebar" class="flex h-full flex-col overflow-hidden border-r border-gray-200 bg-white">
    <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3.5">
      <a href="index.html" class="flex items-center gap-2">
        <div class="flex h-7 w-7 items-center justify-center rounded-md bg-brand-900 text-white text-sm font-bold">A</div>
        <span class="text-[14px] font-semibold text-brand-900">AgroCloud Vision</span>
      </a>
      <button id="logoutBtn" class="text-xs text-gray-400 underline hover:text-brand-700">Log out</button>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-3">
      <!-- Farms -->
      <div class="mb-1 flex items-center justify-between px-1">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Farms</span>
      </div>
      <div id="farmsList" class="mb-2 flex flex-col gap-0.5"></div>
      <form id="addFarmForm" class="mb-5 flex gap-1.5 px-1">
        <input id="newFarmName" placeholder="New farm name" class="min-w-0 flex-1 rounded-md border border-gray-200 px-2.5 py-1.5 text-[12.5px] outline-none focus:ring-2 focus:ring-brand-600/30" />
        <button type="submit" class="shrink-0 rounded-md bg-brand-900 px-2.5 py-1.5 text-[12px] font-medium text-white hover:bg-brand-800">+ Add</button>
      </form>

      <!-- Fields of the selected farm -->
      <div class="mb-1 flex items-center justify-between px-1">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Fields</span>
        <span id="fieldCountBadge" class="text-[11px] text-gray-400"></span>
      </div>
      <div id="fieldsList" class="mb-5 flex flex-col gap-0.5"></div>

      <!-- Compact weather -->
      <div id="weatherSection" class="hidden">
        <div class="mb-1 px-1">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Weather (7 days)</span>
        </div>
        <div id="weatherList" class="flex flex-col gap-1 px-1"></div>
      </div>
    </div>

    <div class="border-t border-gray-100 px-4 py-3 text-[11px] text-gray-400" id="userFooter"></div>
  </aside>

  <!-- ====== Map workspace ====== -->
  <main id="mapMain" class="relative flex-1">
    <div id="mapContainer"></div>

    <!-- current farm name bar -->
    <div class="absolute left-3 top-3 z-[500] rounded-lg bg-white/95 px-3 py-1.5 text-[13px] font-medium text-brand-900 shadow-md ring-1 ring-gray-200">
      <span id="currentFarmName">Loading…</span>
    </div>

    <!-- Add Field control -->
    <div class="absolute right-3 top-3 z-[500] flex flex-col items-end gap-2">
      <button id="addFieldBtn" type="button"
        class="flex items-center gap-2 rounded-lg bg-white px-3 py-2 text-[13px] font-medium text-brand-900 shadow-md ring-1 ring-gray-200 hover:bg-brand-600 hover:text-white">
        + Add Field
      </button>
      <div id="drawMenu" class="hidden flex-col gap-1 rounded-lg bg-white p-1.5 shadow-md ring-1 ring-gray-200">
        <button id="drawPolygonBtn" type="button" class="rounded-md px-3 py-2 text-left text-[13px] text-gray-600 hover:bg-brand-50 hover:text-brand-700">⬠ Draw polygon</button>
        <button id="drawCircleBtn" type="button" class="rounded-md px-3 py-2 text-left text-[13px] text-gray-600 hover:bg-brand-50 hover:text-brand-700">◯ Draw circle</button>
      </div>
    </div>

    <!-- Save-field panel -->
    <div id="savePanel" class="hidden absolute bottom-6 left-1/2 z-[500] w-[min(420px,92%)] -translate-x-1/2 rounded-xl bg-white p-3 shadow-xl ring-1 ring-gray-200">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-[13px] font-medium text-gray-800">Name this field</span>
        <button id="cancelFieldBtn" type="button" class="rounded-md p-1 text-gray-400 hover:bg-black/5 hover:text-gray-700">✕</button>
      </div>
      <div class="flex gap-2">
        <input id="fieldNameInput" placeholder="e.g. North Wheat Block"
          class="flex-1 rounded-md border px-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-brand-600/40" />
        <button id="saveFieldBtn" type="button"
          class="rounded-md bg-brand-600 px-3 py-2 text-[13px] font-medium text-white disabled:opacity-50">Save</button>
      </div>
      <p id="fieldSaveError" class="hidden mt-2 text-[12px] text-red-600"></p>
    </div>

    <!-- No-farm-yet overlay -->
    <div id="noFarmOverlay" class="hidden absolute inset-0 z-[600] flex items-center justify-center bg-white/70 backdrop-blur-sm">
      <div class="w-[min(380px,90%)] rounded-xl bg-white p-6 text-center shadow-xl ring-1 ring-gray-200">
        <h2 class="mb-1 font-semibold text-brand-900">Add your first farm</h2>
        <p class="mb-4 text-sm text-gray-500">Give it a name — you can draw its fields on the map right after.</p>
        <form id="firstFarmForm" class="flex gap-2">
          <input id="firstFarmName" placeholder="Farm name" class="flex-1 rounded-md border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-600/30" />
          <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700">Create</button>
        </form>
      </div>
    </div>

    <!-- global error banner -->
    <div id="errorBanner" class="hidden absolute left-1/2 top-3 z-[700] w-[min(480px,92%)] -translate-x-1/2 rounded-lg bg-red-50 px-4 py-2 text-center text-[13px] text-red-700 ring-1 ring-red-200"></div>
  </main>
</div>

<script>
const API_BASE_URL = 'https://agrocloud-backend-e9ea.onrender.com/api/v1';
const token = localStorage.getItem('accessToken');
if (!token) window.location.href = 'main.html';

const user = JSON.parse(localStorage.getItem('user') || 'null');
if (user) {
  document.getElementById('userFooter').textContent = user.email + (user.role ? ' · ' + user.role : '');
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.clear();
  window.location.href = 'main.html';
});

async function apiGet(path) {
  const res = await fetch(`${API_BASE_URL}${path}`, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401) { localStorage.clear(); window.location.href = 'main.html'; return; }
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  if (res.status === 401) { localStorage.clear(); window.location.href = 'main.html'; return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'Request failed'));
  return data;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function showError(message) {
  const el = document.getElementById('errorBanner');
  el.textContent = message;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 6000);
}

// ====== Geometry helpers (shared logic with farmdetail.html) ======
const DEFAULT_FALLBACK_CENTER = [24.4667, 54.3667];

function circleToRingCoordinates(center, radiusMeters, points) {
  points = points || 64;
  const earthRadius = 6378137;
  const latRad = (center.lat * Math.PI) / 180;
  const ring = [];
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * 2 * Math.PI;
    const dx = radiusMeters * Math.cos(angle);
    const dy = radiusMeters * Math.sin(angle);
    const dLat = dy / earthRadius;
    const dLng = dx / (earthRadius * Math.cos(latRad));
    const pointLat = center.lat + (dLat * 180) / Math.PI;
    const pointLng = center.lng + (dLng * 180) / Math.PI;
    ring.push([pointLng, pointLat]);
  }
  return ring;
}

function layerToPolygonGeoJson(layer, layerType) {
  if (layerType === 'circle') {
    const latlng = layer.getLatLng();
    const radius = layer.getRadius();
    return { type: 'Polygon', coordinates: [circleToRingCoordinates(latlng, radius)] };
  }
  return layer.toGeoJSON().geometry;
}

function computeFieldsCentroid(fieldsWithBoundary) {
  const first = fieldsWithBoundary.find((f) => f.boundaryGeoJson);
  if (!first) return null;
  try {
    const ring = first.boundaryGeoJson.type === 'Polygon' ? first.boundaryGeoJson.coordinates[0] : null;
    if (!ring || !ring.length) return null;
    const sum = ring.reduce((acc, [lng, lat]) => [acc[0] + lat, acc[1] + lng], [0, 0]);
    return [sum[0] / ring.length, sum[1] / ring.length];
  } catch {
    return null;
  }
}

function getFallbackCenter() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(DEFAULT_FALLBACK_CENTER);
    const timeout = setTimeout(() => resolve(DEFAULT_FALLBACK_CENTER), 3000);
    navigator.geolocation.getCurrentPosition(
      (pos) => { clearTimeout(timeout); resolve([pos.coords.latitude, pos.coords.longitude]); },
      () => { clearTimeout(timeout); resolve(DEFAULT_FALLBACK_CENTER); },
      { timeout: 3000 },
    );
  });
}

// ====== Map (single persistent instance for the whole workspace) ======
let mapInstance = null;
let boundaryLayers = [];
let drawnLayer = null;
let activeDrawHandler = null;
let pendingGeometry = null;

function ensureMap(center) {
  if (mapInstance) return mapInstance;

  const map = L.map(document.getElementById('mapContainer')).setView(center, 15);
  mapInstance = map;

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics',
    maxZoom: 19,
  }).addTo(map);

  if (window.L && L.Draw) {
    map.on(L.Draw.Event.CREATED, (event) => {
      const layer = event.layer;
      pendingGeometry = layerToPolygonGeoJson(layer, event.layerType);
      if (drawnLayer) map.removeLayer(drawnLayer);
      layer.setStyle && layer.setStyle({ color: '#facc15', weight: 2, fillOpacity: 0.15, dashArray: '4 4' });
      layer.addTo(map);
      drawnLayer = layer;

      document.getElementById('fieldNameInput').value = '';
      document.getElementById('fieldSaveError').classList.add('hidden');
      document.getElementById('savePanel').classList.remove('hidden');
      document.getElementById('fieldNameInput').focus();
    });
    setupDrawControls(map);
  } else {
    document.getElementById('addFieldBtn').title = 'Drawing tools failed to load — try reloading the page.';
    document.getElementById('addFieldBtn').classList.add('opacity-50', 'cursor-not-allowed');
  }

  setTimeout(() => map.invalidateSize(), 150);
  return map;
}

function setupDrawControls(map) {
  const addFieldBtn = document.getElementById('addFieldBtn');
  const drawMenu = document.getElementById('drawMenu');
  const shapeOptions = { color: '#facc15', weight: 2, fillOpacity: 0.15 };

  addFieldBtn.addEventListener('click', () => {
    if (!state.selectedFarmId) { showError('Add a farm first.'); return; }
    drawMenu.classList.toggle('hidden');
    drawMenu.classList.toggle('flex');
  });

  document.getElementById('drawPolygonBtn').addEventListener('click', () => {
    drawMenu.classList.add('hidden'); drawMenu.classList.remove('flex');
    if (activeDrawHandler) activeDrawHandler.disable();
    activeDrawHandler = new L.Draw.Polygon(map, { allowIntersection: false, showArea: true, shapeOptions });
    activeDrawHandler.enable();
  });

  document.getElementById('drawCircleBtn').addEventListener('click', () => {
    drawMenu.classList.add('hidden'); drawMenu.classList.remove('flex');
    if (activeDrawHandler) activeDrawHandler.disable();
    activeDrawHandler = new L.Draw.Circle(map, { shapeOptions });
    activeDrawHandler.enable();
  });

  document.getElementById('cancelFieldBtn').addEventListener('click', () => {
    if (drawnLayer) map.removeLayer(drawnLayer);
    drawnLayer = null;
    pendingGeometry = null;
    document.getElementById('savePanel').classList.add('hidden');
  });

  document.getElementById('saveFieldBtn').addEventListener('click', async () => {
    const name = document.getElementById('fieldNameInput').value.trim();
    const errorEl = document.getElementById('fieldSaveError');
    errorEl.classList.add('hidden');
    if (!name || !pendingGeometry || !state.selectedFarmId) return;

    const saveBtn = document.getElementById('saveFieldBtn');
    saveBtn.disabled = true;
    try {
      await apiPost('/fields', { name, farmId: state.selectedFarmId, boundary: pendingGeometry });
      if (drawnLayer) map.removeLayer(drawnLayer);
      drawnLayer = null;
      pendingGeometry = null;
      document.getElementById('savePanel').classList.add('hidden');
      await loadSelectedFarmDetail();
    } catch (err) {
      errorEl.textContent = err.message || 'Could not save this field. Please try again.';
      errorEl.classList.remove('hidden');
    } finally {
      saveBtn.disabled = false;
    }
  });
}

function redrawBoundaries(fieldsWithBoundary) {
  if (!mapInstance) return;
  boundaryLayers.forEach((l) => mapInstance.removeLayer(l));
  boundaryLayers = [];
  fieldsWithBoundary.forEach((field) => {
    if (!field.boundaryGeoJson) return;
    const layer = L.geoJSON(field.boundaryGeoJson, {
      style: { color: '#16a34a', weight: 2, fillOpacity: 0.15 },
    }).bindPopup(escapeHtml(field.name)).addTo(mapInstance);
    layer.fieldId = field.id;
    boundaryLayers.push(layer);
  });
}

function flyToField(fieldId) {
  const layer = boundaryLayers.find((l) => l.fieldId === fieldId);
  if (layer && mapInstance) {
    mapInstance.fitBounds(layer.getBounds(), { maxZoom: 17, padding: [40, 40] });
    layer.openPopup();
  }
}

// ====== App state ======
const state = { farms: [], selectedFarmId: null };

function renderFarmsList() {
  const list = document.getElementById('farmsList');
  if (state.farms.length === 0) {
    list.innerHTML = '<p class="px-1 py-1 text-[12.5px] text-gray-400">No farms yet.</p>';
    return;
  }
  list.innerHTML = state.farms.map((f) => `
    <button data-farm-id="${f.id}"
      class="farm-item flex items-center justify-between rounded-md px-2.5 py-1.5 text-left text-[13px] transition-colors ${
        f.id === state.selectedFarmId ? 'bg-brand-900 text-white' : 'text-gray-700 hover:bg-gray-100'
      }">
      <span class="truncate">${escapeHtml(f.name)}</span>
      <span class="text-[11px] ${f.id === state.selectedFarmId ? 'text-white/70' : 'text-gray-400'}">${f.fields?.length || 0}</span>
    </button>
  `).join('');

  list.querySelectorAll('.farm-item').forEach((btn) => {
    btn.addEventListener('click', () => selectFarm(btn.dataset.farmId));
  });
}

function renderFieldsList(fields) {
  document.getElementById('fieldCountBadge').textContent = fields.length ? `(${fields.length})` : '';
  const list = document.getElementById('fieldsList');
  if (!fields.length) {
    list.innerHTML = '<p class="px-1 py-1 text-[12.5px] text-gray-400">No fields yet — draw one on the map.</p>';
    return;
  }
  list.innerHTML = fields.map((f) => `
    <button data-field-id="${f.id}" class="field-item flex items-center justify-between rounded-md px-2.5 py-1.5 text-left text-[12.5px] text-gray-700 hover:bg-gray-100">
      <span class="truncate">${escapeHtml(f.name)}</span>
      <span class="text-[11px] text-gray-400">${f.areaHectares != null ? f.areaHectares.toFixed(2) + ' ha' : '—'}</span>
    </button>
  `).join('');
  list.querySelectorAll('.field-item').forEach((btn) => {
    btn.addEventListener('click', () => flyToField(btn.dataset.fieldId));
  });
}

function renderWeather(days) {
  const section = document.getElementById('weatherSection');
  const list = document.getElementById('weatherList');
  if (!days || !days.length) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');
  list.innerHTML = days.slice(0, 7).map((d) => `
    <div class="flex items-center justify-between rounded-md bg-gray-50 px-2 py-1 text-[11.5px]">
      <span class="text-gray-500">${escapeHtml(d.date)}</span>
      <span class="font-medium text-brand-900">${Math.round(d.temperatureMaxC)}°/${Math.round(d.temperatureMinC)}°</span>
      <span class="text-blue-600">${d.precipitationMm}mm</span>
    </div>
  `).join('');
}

async function loadFarmsList() {
  const farms = await apiGet('/farms');
  state.farms = farms || [];

  const params = new URLSearchParams(window.location.search);
  const requested = params.get('farm');
  if (requested && state.farms.some((f) => f.id === requested)) {
    state.selectedFarmId = requested;
  } else if (!state.selectedFarmId && state.farms.length) {
    state.selectedFarmId = state.farms[0].id;
  }

  renderFarmsList();

  if (!state.farms.length) {
    document.getElementById('noFarmOverlay').classList.remove('hidden');
    document.getElementById('currentFarmName').textContent = 'No farm yet';
    ensureMap(DEFAULT_FALLBACK_CENTER);
    return;
  }

  document.getElementById('noFarmOverlay').classList.add('hidden');
  await loadSelectedFarmDetail();
}

async function loadSelectedFarmDetail() {
  if (!state.selectedFarmId) return;
  const farm = await apiGet(`/farms/${state.selectedFarmId}`);
  document.getElementById('currentFarmName').textContent = farm.name;

  const fields = farm.fields || [];
  renderFieldsList(fields);

  const fieldsWithBoundary = await Promise.all(
    fields.map(async (field) => {
      try {
        const geojson = await apiGet(`/fields/${field.id}/boundary.geojson`);
        return { ...field, boundaryGeoJson: geojson };
      } catch {
        return field;
      }
    }),
  );

  const hasFarmCoords = !!(farm.latitude && farm.longitude);
  const center = hasFarmCoords
    ? [farm.latitude, farm.longitude]
    : computeFieldsCentroid(fieldsWithBoundary) || (await getFallbackCenter());

  ensureMap(center);
  mapInstance.setView(center, mapInstance.getZoom() < 10 ? 15 : mapInstance.getZoom());
  redrawBoundaries(fieldsWithBoundary);

  if (hasFarmCoords && fields[0]) {
    const today = new Date();
    const in7Days = new Date(Date.now() + 7 * 86400000);
    const fmt = (d) => d.toISOString().slice(0, 10);
    try {
      const weather = await apiGet(
        `/weather/field/${fields[0].id}/forecast?lat=${farm.latitude}&lng=${farm.longitude}&start=${fmt(today)}&end=${fmt(in7Days)}`,
      );
      renderWeather(weather.days);
    } catch {
      renderWeather([]);
    }
  } else {
    renderWeather([]);
  }
}

function selectFarm(farmId) {
  if (farmId === state.selectedFarmId) return;
  state.selectedFarmId = farmId;
  const url = new URL(window.location.href);
  url.searchParams.set('farm', farmId);
  window.history.replaceState({}, '', url);
  renderFarmsList();
  loadSelectedFarmDetail().catch((err) => showError(err.message || 'Could not load this farm.'));
}

async function createFarm(name) {
  if (!name.trim()) return;
  const farm = await apiPost('/farms', { name: name.trim() });
  state.selectedFarmId = farm.id;
  await loadFarmsList();
}

document.getElementById('addFarmForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('newFarmName');
  try {
    await createFarm(input.value);
    input.value = '';
  } catch (err) {
    showError(err.message || 'Could not create the farm.');
  }
});

document.getElementById('firstFarmForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('firstFarmName');
  try {
    await createFarm(input.value);
    input.value = '';
  } catch (err) {
    showError(err.message || 'Could not create the farm.');
  }
});

loadFarmsList().catch((err) => {
  showError('Could not load your farms. The server may be waking up from sleep (free tier) — try reloading in a moment.');
  ensureMap(DEFAULT_FALLBACK_CENTER);
});
</script>
</body>
</html>
