<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — AgroCloud Vision</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: {
    50:'#eafbf0',600:'#16a34a',700:'#0f3d22',900:'#052e16'
  } } } } };
</script>
</head>
<body class="min-h-screen bg-emerald-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg relative">
    <a href="index.html" class="absolute -top-8 left-0 text-sm text-gray-500 hover:text-brand-700">&larr; Back to home</a>

    <h1 class="mb-1 text-2xl font-bold text-brand-900">AgroCloud Vision</h1>
    <p id="subtitle" class="mb-6 text-sm text-gray-500">Sign in to your account</p>

    <form id="authForm" class="space-y-4">
      <div id="registerFields" class="space-y-4 hidden">
        <input id="organizationName" class="w-full rounded-lg border p-3" placeholder="Organization / Farm name">
        <input id="fullName" class="w-full rounded-lg border p-3" placeholder="Full name">
      </div>
      <input id="email" type="email" required class="w-full rounded-lg border p-3" placeholder="Email address">
      <input id="password" type="password" required minlength="8" class="w-full rounded-lg border p-3" placeholder="Password (min 8 characters)">

      <p id="errorMsg" class="hidden text-sm text-red-600"></p>

      <button id="submitBtn" type="submit" class="w-full rounded-lg bg-brand-600 p-3 font-semibold text-white hover:bg-brand-700 disabled:opacity-60">
        Sign In
      </button>
    </form>

    <button id="toggleMode" class="mt-4 w-full text-center text-sm text-brand-700 underline">
      Don't have an account? Create an organization
    </button>
  </div>

<script>
const API_BASE_URL = 'https://agrocloud-backend-e9ea.onrender.com/api/v1';

let mode = 'login';
const form = document.getElementById('authForm');
const subtitle = document.getElementById('subtitle');
const registerFields = document.getElementById('registerFields');
const submitBtn = document.getElementById('submitBtn');
const toggleBtn = document.getElementById('toggleMode');
const errorMsg = document.getElementById('errorMsg');

// Already signed in? Skip straight to the dashboard.
if (localStorage.getItem('accessToken')) {
  window.location.href = 'dashboard.html';
}

toggleBtn.addEventListener('click', () => {
  mode = mode === 'login' ? 'register' : 'login';
  subtitle.textContent = mode === 'login' ? 'Sign in to your account' : 'Create a new organization';
  registerFields.classList.toggle('hidden', mode !== 'register');
  submitBtn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  toggleBtn.textContent = mode === 'login'
    ? "Don't have an account? Create an organization"
    : 'Already have an account? Sign in';
  errorMsg.classList.add('hidden');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = '...';

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    let res;
    if (mode === 'login') {
      res = await fetch(`${API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
    } else {
      const organizationName = document.getElementById('organizationName').value;
      const fullName = document.getElementById('fullName').value;
      res = await fetch(`${API_BASE_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ organizationName, fullName, email, password }),
      });
    }

    const data = await res.json();
    if (!res.ok) {
      throw new Error(Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'Authentication failed'));
    }

    localStorage.setItem('accessToken', data.accessToken);
    localStorage.setItem('refreshToken', data.refreshToken);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = err.message || 'Could not reach the server. It may be waking up from sleep (free tier) — please try again in 30-60 seconds.';
    errorMsg.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  }
});
</script>
</body>
</html>
