schema_version: "1.1"
name: add-flatgeobuf-support
expected_outcome: |
  gis-import.js reads .fgb (via GDAL or a FlatGeobuf reader), reprojects to WGS84, and the Upload file accept list and caption include it. A FlatGeobuf fixture in a non-WGS84 projection is added to make-fixtures.js and test_import.py, and the test passes.
