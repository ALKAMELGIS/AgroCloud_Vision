<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Detail — AgroCloud Vision</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: {
    50:'#eafbf0',600:'#16a34a',700:'#0f3d22',900:'#052e16'
  } } } } };
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="h-14 border-b bg-white flex items-center justify-between px-6">
    <a href="index.html" class="flex items-center gap-2">
      <div class="flex h-7 w-7 items-center justify-center rounded-md bg-brand-600 text-white font-bold text-sm">A</div>
      <span class="font-semibold text-brand-900">AgroCloud Vision</span>
    </a>
    <button id="logoutBtn" class="text-sm text-gray-500 underline hover:text-brand-700">Log out</button>
  </header>

  <main class="mx-auto max-w-4xl p-6">
    <button onclick="window.location.href='dashboard.html'" class="mb-4 text-sm text-brand-700 underline">&larr; Back to Farms</button>

    <div id="loadingMsg" class="text-gray-400">Loading...</div>
    <div id="errorMsg" class="hidden text-sm text-red-600 mb-4"></div>

    <div id="content" class="hidden">
      <h1 id="farmName" class="mb-4 text-xl font-bold text-brand-900"></h1>

      <section class="mb-6">
        <h2 class="mb-2 font-semibold text-gray-700">Weather (next 7 days)</h2>
        <div id="weatherWidget" class="flex gap-3 overflow-x-auto pb-2">
          <p class="text-sm text-gray-400">No weather data yet.</p>
        </div>
      </section>

      <section>
        <div class="mb-2 flex items-center justify-between">
          <h2 class="font-semibold text-gray-700">Field Map</h2>
          <span class="text-xs text-gray-400">Use "Add Field" to draw a boundary directly on the map</span>
        </div>
        <div class="relative w-full overflow-hidden rounded-xl border" style="height:460px">
          <div id="mapContainer" style="height:100%;width:100%"></div>

          <div class="absolute right-3 top-3 z-[500] flex flex-col items-end gap-2">
            <button id="addFieldBtn" type="button"
              class="flex items-center gap-2 rounded-lg bg-white px-3 py-2 text-[13px] font-medium text-brand-900 shadow-md ring-1 ring-gray-200 hover:bg-brand-600 hover:text-white">
              + Add Field
            </button>
            <div id="drawMenu" class="hidden flex-col gap-1 rounded-lg bg-white p-1.5 shadow-md ring-1 ring-gray-200">
              <button id="drawPolygonBtn" type="button" class="rounded-md px-3 py-2 text-left text-[13px] text-gray-600 hover:bg-brand-50 hover:text-brand-700">⬠ Draw polygon</button>
              <button id="drawCircleBtn" type="button" class="rounded-md px-3 py-2 text-left text-[13px] text-gray-600 hover:bg-brand-50 hover:text-brand-700">◯ Draw circle</button>
            </div>
          </div>

          <div id="savePanel" class="hidden absolute bottom-3 left-1/2 z-[500] w-[min(420px,92%)] -translate-x-1/2 rounded-xl bg-white p-3 shadow-xl ring-1 ring-gray-200">
            <div class="mb-2 flex items-center justify-between">
              <span class="text-[13px] font-medium text-gray-800">Name this field</span>
              <button id="cancelFieldBtn" type="button" class="rounded-md p-1 text-gray-400 hover:bg-black/5 hover:text-gray-700">✕</button>
            </div>
            <div class="flex gap-2">
              <input id="fieldNameInput" placeholder="e.g. North Wheat Block"
                class="flex-1 rounded-md border px-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-brand-600/40" />
              <button id="saveFieldBtn" type="button"
                class="rounded-md bg-brand-600 px-3 py-2 text-[13px] font-medium text-white disabled:opacity-50">Save</button>
            </div>
            <p id="fieldSaveError" class="hidden mt-2 text-[12px] text-red-600"></p>
          </div>
        </div>
        <p id="noCoordsMsg" class="hidden text-sm text-gray-400">No coordinates set for this farm yet.</p>
      </section>

      <section class="mt-6">
        <h2 class="mb-2 font-semibold text-gray-700">Fields (<span id="fieldCount">0</span>)</h2>
        <ul id="fieldsList" class="divide-y rounded-lg border bg-white"></ul>
      </section>
    </div>
  </main>

<script>
const API_BASE_URL = 'https://agrocloud-backend-e9ea.onrender.com/api/v1';
const token = localStorage.getItem('accessToken');
if (!token) window.location.href = 'main.html';

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.clear();
  window.location.href = 'main.html';
});

const params = new URLSearchParams(window.location.search);
const farmId = params.get('id');
if (!farmId) {
  document.getElementById('loadingMsg').textContent = 'No farm id given in the URL.';
}

async function apiGet(path) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (res.status === 401) {
    localStorage.clear();
    window.location.href = 'main.html';
    return;
  }
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderWeather(days) {
  const widget = document.getElementById('weatherWidget');
  if (!days || !days.length) {
    widget.innerHTML = '<p class="text-sm text-gray-400">No weather data yet.</p>';
    return;
  }
  widget.innerHTML = days.slice(0, 7).map((d) => `
    <div class="min-w-[110px] rounded-lg border bg-white p-3 text-center shadow-sm">
      <p class="text-xs text-gray-400">${escapeHtml(d.date)}</p>
      <p class="mt-1 text-lg font-bold text-brand-900">${Math.round(d.temperatureMaxC)}°<span class="text-sm font-normal text-gray-400">/${Math.round(d.temperatureMinC)}°</span></p>
      <p class="mt-1 text-xs text-blue-600">💧 ${d.precipitationMm} mm</p>
      <p class="text-xs text-gray-400">💨 ${Math.round(d.windSpeedMaxKmh)} km/h</p>
    </div>
  `).join('');
}

function renderFieldsList(fields) {
  document.getElementById('fieldCount').textContent = fields.length;
  const list = document.getElementById('fieldsList');
  list.innerHTML = fields.map((f) => `
    <li class="flex justify-between p-3 text-sm">
      <span>${escapeHtml(f.name)}</span>
      <span class="text-gray-400">${f.areaHectares != null ? f.areaHectares.toFixed(2) : '—'} ha</span>
    </li>
  `).join('');
}

function circleToRingCoordinates(center, radiusMeters, points) {
  points = points || 64;
  const earthRadius = 6378137; // WGS84 radius (meters)
  const latRad = (center.lat * Math.PI) / 180;
  const ring = [];
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * 2 * Math.PI;
    const dx = radiusMeters * Math.cos(angle);
    const dy = radiusMeters * Math.sin(angle);
    const dLat = dy / earthRadius;
    const dLng = dx / (earthRadius * Math.cos(latRad));
    const pointLat = center.lat + (dLat * 180) / Math.PI;
    const pointLng = center.lng + (dLng * 180) / Math.PI;
    ring.push([pointLng, pointLat]); // GeoJSON order: [lng, lat]
  }
  return ring;
}

function layerToPolygonGeoJson(layer, layerType) {
  if (layerType === 'circle') {
    const latlng = layer.getLatLng();
    const radius = layer.getRadius();
    return { type: 'Polygon', coordinates: [circleToRingCoordinates(latlng, radius)] };
  }
  return layer.toGeoJSON().geometry;
}

// مركز افتراضي معقول (الإمارات) يُستخدم فقط إذا تعذّر تحديد موقع المتصفح —
// لا يؤثر على أي بيانات محفوظة، فقط نقطة بداية لعرض الخريطة.
const DEFAULT_FALLBACK_CENTER = [24.4667, 54.3667];

function computeFieldsCentroid(fieldsWithBoundary) {
  const firstWithBoundary = fieldsWithBoundary.find((f) => f.boundaryGeoJson);
  if (!firstWithBoundary) return null;
  try {
    const ring =
      firstWithBoundary.boundaryGeoJson.type === 'Polygon'
        ? firstWithBoundary.boundaryGeoJson.coordinates[0]
        : null;
    if (!ring || !ring.length) return null;
    const sum = ring.reduce((acc, [lng, lat]) => [acc[0] + lat, acc[1] + lng], [0, 0]);
    return [sum[0] / ring.length, sum[1] / ring.length];
  } catch {
    return null;
  }
}

function getFallbackCenter() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve(DEFAULT_FALLBACK_CENTER);
      return;
    }
    const timeout = setTimeout(() => resolve(DEFAULT_FALLBACK_CENTER), 3000);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timeout);
        resolve([pos.coords.latitude, pos.coords.longitude]);
      },
      () => {
        clearTimeout(timeout);
        resolve(DEFAULT_FALLBACK_CENTER);
      },
      { timeout: 3000 },
    );
  });
}

let mapInstance = null;
let boundaryLayers = [];
let drawnLayer = null;
let activeDrawHandler = null;
let pendingGeometry = null;
let currentFarmId = null;

function renderMap(center, fieldsWithBoundary, farmId) {
  currentFarmId = farmId;
  const noCoordsMsg = document.getElementById('noCoordsMsg');
  const mapWrapper = document.querySelector('#mapContainer').closest('.relative');
  if (!center) {
    mapWrapper.classList.add('hidden');
    noCoordsMsg.classList.remove('hidden');
    return;
  }

  // أول مرة فقط: أنشئ الخريطة واربط أدوات الرسم. في كل تحديث لاحق (بعد حفظ حقل)
  // لا نعيد إنشاء الخريطة — فقط نحدّث طبقات حدود الحقول، لأن Leaflet لا يسمح
  // بتهيئة نفس الـ <div> كخريطة أكثر من مرة.
  if (!mapInstance) {
    const mapContainer = document.getElementById('mapContainer');
    const map = L.map(mapContainer).setView(center, 15);
    mapInstance = map;

    // قاعدة خريطة قمر صناعي (Esri World Imagery, مجانية بدون مفتاح API) —
    // أنسب لعمل زراعي حقيقي من خريطة شوارع عادية، لأنها تُظهر نسيج الأرض
    // والحقول فعلياً بدل الأسماء والطرق فقط.
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics',
      maxZoom: 19,
    }).addTo(map);

    // تحصين ضد تأخّر/فشل تحميل Leaflet.draw من الـ CDN: الخريطة وحدودها تبقى
    // تعمل حتى لو تعطّلت أدوات الرسم تحديداً، فلا يفشل تحميل الصفحة كلها لهذا السبب.
    if (window.L && L.Draw) {
      map.on(L.Draw.Event.CREATED, (event) => {
        const layer = event.layer;
        pendingGeometry = layerToPolygonGeoJson(layer, event.layerType);
        if (drawnLayer) map.removeLayer(drawnLayer);
        layer.setStyle && layer.setStyle({ color: '#16a34a', weight: 2, fillOpacity: 0.12, dashArray: '4 4' });
        layer.addTo(map);
        drawnLayer = layer;

        document.getElementById('fieldNameInput').value = '';
        document.getElementById('fieldSaveError').classList.add('hidden');
        document.getElementById('savePanel').classList.remove('hidden');
        document.getElementById('fieldNameInput').focus();
      });

      try {
        setupDrawControls(map);
      } catch (err) {
        console.error('Could not set up field-drawing tools:', err);
      }
    } else {
      document.getElementById('addFieldBtn').title = 'Drawing tools failed to load — try reloading the page.';
      document.getElementById('addFieldBtn').classList.add('opacity-50', 'cursor-not-allowed');
    }

    // إصلاح مشكلة شائعة مع Leaflet + Tailwind (Play CDN): إذا هُيّئت الخريطة
    // قبل أن يُطبَّق ارتفاع الحاوية فعلياً، تظهر رمادية بدون بلاطات. نجبرها
    // على إعادة حساب حجمها بعد لحظة قصيرة من التحميل.
    setTimeout(() => map.invalidateSize(), 150);
  }

  boundaryLayers.forEach((l) => mapInstance.removeLayer(l));
  boundaryLayers = [];
  fieldsWithBoundary.forEach((field) => {
    if (!field.boundaryGeoJson) return;
    const layer = L.geoJSON(field.boundaryGeoJson, {
      style: { color: '#16a34a', weight: 2, fillOpacity: 0.15 },
    }).bindPopup(escapeHtml(field.name)).addTo(mapInstance);
    boundaryLayers.push(layer);
  });
}

function setupDrawControls(map) {
  const addFieldBtn = document.getElementById('addFieldBtn');
  const drawMenu = document.getElementById('drawMenu');
  const shapeOptions = { color: '#16a34a', weight: 2, fillOpacity: 0.12 };

  addFieldBtn.addEventListener('click', () => {
    drawMenu.classList.toggle('hidden');
    drawMenu.classList.toggle('flex');
  });

  document.getElementById('drawPolygonBtn').addEventListener('click', () => {
    drawMenu.classList.add('hidden');
    drawMenu.classList.remove('flex');
    if (activeDrawHandler) activeDrawHandler.disable();
    activeDrawHandler = new L.Draw.Polygon(map, { allowIntersection: false, showArea: true, shapeOptions });
    activeDrawHandler.enable();
  });

  document.getElementById('drawCircleBtn').addEventListener('click', () => {
    drawMenu.classList.add('hidden');
    drawMenu.classList.remove('flex');
    if (activeDrawHandler) activeDrawHandler.disable();
    activeDrawHandler = new L.Draw.Circle(map, { shapeOptions });
    activeDrawHandler.enable();
  });

  document.getElementById('cancelFieldBtn').addEventListener('click', () => {
    if (drawnLayer) map.removeLayer(drawnLayer);
    drawnLayer = null;
    pendingGeometry = null;
    document.getElementById('savePanel').classList.add('hidden');
  });

  document.getElementById('saveFieldBtn').addEventListener('click', async () => {
    const name = document.getElementById('fieldNameInput').value.trim();
    const errorEl = document.getElementById('fieldSaveError');
    errorEl.classList.add('hidden');
    if (!name || !pendingGeometry) return;

    const saveBtn = document.getElementById('saveFieldBtn');
    saveBtn.disabled = true;
    try {
      const res = await fetch(`${API_BASE_URL}/fields`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ name, farmId: currentFarmId, boundary: pendingGeometry }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || 'Request failed: ' + res.status);
      }
      if (drawnLayer) map.removeLayer(drawnLayer);
      drawnLayer = null;
      pendingGeometry = null;
      document.getElementById('savePanel').classList.add('hidden');
      loadFarm();
    } catch (err) {
      errorEl.textContent = typeof err.message === 'string' ? err.message : 'Could not save this field. Please try again.';
      errorEl.classList.remove('hidden');
    } finally {
      saveBtn.disabled = false;
    }
  });
}

async function loadFarm() {
  // المرحلة الحرجة فقط: جلب بيانات المزرعة نفسها. أي فشل هنا فعلاً يمنع فتح
  // الصفحة، فيستحق رسالة "Could not load this farm".
  let farm;
  try {
    farm = await apiGet(`/farms/${farmId}`);
  } catch (err) {
    document.getElementById('loadingMsg').classList.add('hidden');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = 'Could not load this farm. The server may be waking up from sleep (free tier) — try reloading in a moment.';
    errorMsg.classList.remove('hidden');
    return;
  }

  document.getElementById('farmName').textContent = farm.name;
  document.getElementById('loadingMsg').classList.add('hidden');
  document.getElementById('errorMsg').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');

  const fields = farm.fields || [];
  renderFieldsList(fields);

  // من هنا فصاعداً كل خطوة اختيارية بذاتها: فشل خريطة/طقس/أداة رسم لا يجب أن
  // يُخفي بيانات المزرعة التي نجح تحميلها فعلاً، فكل واحدة بمعزل عن الأخرى.
  const fieldsWithBoundary = await Promise.all(
    fields.map(async (field) => {
      try {
        const geojson = await apiGet(`/fields/${field.id}/boundary.geojson`);
        return { ...field, boundaryGeoJson: geojson };
      } catch {
        return field;
      }
    }),
  );

  // الخريطة تُفتح دائماً — رسم الحقول لا يحتاج إحداثيات مُسبقة للمزرعة.
  // إذا لم تملك المزرعة إحداثيات بعد: نتمركز على أول حقل مرسوم فعلاً، وإلا
  // نحاول موقع المتصفح الحالي، وإلا مركز افتراضي معقول — فقط لعرض الخريطة
  // ليرسم المستخدم حقله الأول عليها مباشرة عبر أيقونة "Add Field".
  const hasFarmCoords = !!(farm.latitude && farm.longitude);
  try {
    const center = hasFarmCoords
      ? [farm.latitude, farm.longitude]
      : computeFieldsCentroid(fieldsWithBoundary) || (await getFallbackCenter());
    renderMap(center, fieldsWithBoundary, farm.id);
  } catch (err) {
    console.error('Could not render the field map:', err);
  }

  if (hasFarmCoords) {
    const today = new Date();
    const in7Days = new Date(Date.now() + 7 * 86400000);
    const fmt = (d) => d.toISOString().slice(0, 10);
    const firstFieldId = fields[0]?.id;
    if (firstFieldId) {
      try {
        const weather = await apiGet(
          `/weather/field/${firstFieldId}/forecast?lat=${farm.latitude}&lng=${farm.longitude}&start=${fmt(today)}&end=${fmt(in7Days)}`,
        );
        renderWeather(weather.days);
      } catch {
        renderWeather([]);
      }
    }
  } else {
    renderWeather([]);
  }
}

if (farmId) loadFarm();
</script>
</body>
</html>
