<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting… — AgroSyntra One</title>
</head>
<body>
<!--
  Farm detail (map + fields) is now part of the single map Workspace, opened
  directly after sign-in instead of a separate per-farm page. This redirect
  exists only so old bookmarks/links to farmdetail.html?id=... keep working,
  forwarding the farm id to the Workspace's own ?farm= parameter.
-->
<script>
  const params = new URLSearchParams(window.location.search);
  const farmId = params.get('id');
  window.location.replace(farmId ? `workspace.html?farm=${encodeURIComponent(farmId)}` : 'workspace.html');
</script>
<p><a href="workspace.html">Continue to your Workspace</a></p>
</body>
</html>
